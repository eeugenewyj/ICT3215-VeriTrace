[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veritrace"
version = "0.1.0"
description = "Local testimony-to-artefact verification for acquired Windows evidence"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "httpx>=0.27,<1", "jinja2>=3,<4"]

[project.scripts]
veritrace = "veritrace.cli:main"

[dependency-groups]
dev = ["pytest", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/veritrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires acquired evidence, configured parsers and a live local model"]
